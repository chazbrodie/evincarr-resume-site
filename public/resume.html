<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evin Carr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:     #FAFAF9;
      --ink:    #18181B;
      --body:   #3F3F46;
      --mid:    #52525B;
      --low:    #71717A;
      --line:   #D4D4D8;
      --teal:   #155E75;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--body);
      font-family: 'Manrope', system-ui, sans-serif;
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      border-top: 3px solid var(--teal);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--teal); }

    /* ── Page container ──────────────────────────────────────── */
    .page {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 48px 100px;
    }

    /* ── Page header ─────────────────────────────────────────── */
    .page-header {
      padding-top: 64px;
      animation: fadeUp 0.45s ease-out both;
    }

    .name {
      font-size: clamp(2.6rem, 5vw, 4rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .header-bottom {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 36px;
      padding: 22px 0 60px;
      border-top: 2px solid var(--ink);
    }

    .title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--mid);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
    }
    .contact-plain {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--low);
    }
    .contact-sep {
      color: var(--line);
      user-select: none;
    }
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--mid);
      font-weight: 500;
      padding: 4px 11px;
      border-radius: 3px;
      border: 1px solid var(--line);
      background: transparent;
      transition: border-color 0.15s, color 0.15s, transform 0.12s;
    }
    .contact-link:hover {
      border-color: var(--teal);
      color: var(--teal);
      transform: translateY(-1px);
    }
    .contact-link svg {
      opacity: 0.4;
      flex-shrink: 0;
    }

    .photo img {
      width: 118px;
      height: 143px;
      object-fit: cover;
      object-position: center top;
      display: block;
      border-radius: 2px;
    }

    /* ── Sections ────────────────────────────────────────────── */
    .section {
      border-top: 1px solid var(--line);
      padding-top: 40px;
      margin-bottom: 60px;
    }

    .section-head {
      margin-bottom: 26px;
    }
    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--teal);
    }

    /* ── About ───────────────────────────────────────────────── */
    .about p {
      font-size: 1.05rem;
      color: var(--body);
      line-height: 1.78;
      margin-bottom: 14px;
    }
    .about p:last-child { margin-bottom: 0; }

    /* ── Highlights ──────────────────────────────────────────── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 36px; }

    .hl-head {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .hl-list { list-style: none; }
    .hl-list li {
      display: flex;
      gap: 10px;
      font-size: 0.95rem;
      color: var(--body);
      line-height: 1.55;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }
    .hl-list li:last-child { border-bottom: none; padding-bottom: 0; }
    .hl-dot { color: var(--teal); flex-shrink: 0; margin-top: 2px; font-size: 0.7rem; line-height: 1.8; }

    /* ── Experience ──────────────────────────────────────────── */
    .exp-item {
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
    }
    .exp-item:first-child { padding-top: 0; }
    .exp-item:last-child { border-bottom: none; padding-bottom: 0; }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 2px;
    }
    .exp-role {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .exp-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--low);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .exp-company {
      font-size: 0.92rem;
      color: var(--mid);
      font-weight: 600;
      margin-bottom: 7px;
    }
    .exp-desc {
      font-size: 0.95rem;
      color: var(--mid);
      font-style: italic;
      margin-bottom: 10px;
      line-height: 1.65;
    }
    .exp-list { list-style: none; }
    .exp-list li {
      font-size: 0.95rem;
      color: var(--body);
      line-height: 1.65;
      padding: 3px 0 3px 16px;
      position: relative;
    }
    .exp-list li::before {
      content: '–';
      position: absolute;
      left: 0;
      color: var(--line);
    }

    /* ── Education ───────────────────────────────────────────── */
    .edu-degree {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .edu-school {
      font-size: 0.95rem;
      color: var(--mid);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .edu-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--low);
    }

    /* ── Skills ──────────────────────────────────────────────── */
    .skills-four {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 26px 36px;
    }
    .skill-group-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 10px;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      padding: 4px 11px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 3px;
      font-size: 0.88rem;
      color: var(--mid);
      transition: border-color 0.15s, color 0.15s;
      cursor: default;
    }
    .tag:hover { border-color: var(--teal); color: var(--ink); }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--line);
      margin-top: 48px;
      padding-top: 24px;
      font-size: 0.88rem;
      color: var(--low);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer a { color: var(--low); }
    footer a:hover { color: var(--teal); }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 680px) {
      .page { padding: 0 20px 60px; }
      .page-header { padding-top: 36px; }
      .name { font-size: clamp(2.8rem, 11vw, 4rem); margin-bottom: 18px; }
      .header-bottom { grid-template-columns: 1fr; gap: 20px; }
      .photo { order: -1; }
      .photo img { width: 80px; height: 96px; }
      .two-col, .skills-four { grid-template-columns: 1fr; }
      footer { flex-direction: column; gap: 6px; text-align: center; }
    }
  </style>
</head>
<body>

<!--
  Chat UI was intentionally removed from this file.
  The /api/chat endpoint (app/api/chat/route.ts) is still deployed and reachable;
  only the visible chatbot widget on the page was nuked. To re-enable, restore
  the CSS/JS/render blocks from git history.
-->
<script>
  const data = {
    name: "Evin Carr",
    title: "Operations & Automations Lead",
    location: "Remote",
    linkedin: "linkedin.com/in/evincarr",
    website: "resumehowl.com",

    bio: `Operations leader with 10+ years building systems that scale. Now working at the intersection of systems thinking and AI-powered automation. Currently taking a fast-moving MarTech consultancy's operations from v1 to v3: designing workflows, shipping automations, and replacing ad hoc processes with infrastructure that runs without hand-holding. Volunteer disaster caseworker with the American Red Cross.`,

    highlights: {
      automations: [
        "Designed and deployed an Event Operations Dashboard managing 5–20 concurrent events with real-time RSVP tracking, milestone-based status flags, and partner-specific reporting views across 12–15 partners",
        "Built a one-click asset generation system using the Claude API that produces a full event package per event, with RSVPs auto-synced to calendar and partner-facing tracking in real time",
        "Built a Product Feedback Cohort Tracker in Apps Script using the Claude API: consolidates member status across Drive and Apollo, automating intros, demos, post-call feedback, and gift card distribution",
        "Slack-integrated invoice alerts via Zapier, prospect list scraping for cohort recruitment, and attendee schedule personalization for a 125-person annual Summit",
        "Built ResumeHowl as a solo SaaS: three-tier pricing, Stripe billing, transactional email, row-level security, and an admin dashboard for real-time usage and error monitoring"
      ],
      achievements: [
        "Took a MarTech consultancy's operations from v1 to v3 across event ops, partner communications, and pipeline management",
        "Solo-built and launched ResumeHowl end-to-end: product architecture, pricing strategy, compliance, billing, and admin tooling",
        "Drove consistent 10%+ revenue growth year over year as General Manager at Global Bikes, leading multiple retail locations sequentially with full P&L ownership",
        "American Red Cross volunteer disaster recovery caseworker — virtual case management in Salesforce, coordinating across 2–3 specialized teams per case",
        "Self-taught the entire automation stack: from first Apps Script to deploying production tools in weeks"
      ]
    },

    experience: [
      {
        role: "Operations & Automations Lead",
        company: "Storm King Consulting",
        period: "Jan 2026 – Present",
        location: "Remote",
        description: "Built and own operational infrastructure for a 900+ executive MarTech network, taking the team's systems from v1 to v3 across event operations, partner communications, and pipeline management.",
        achievements: [
          "Designed and deployed an Event Operations Dashboard managing 5–20 concurrent events: real-time RSVP tracking against goals, milestone-based status flags, and partner-specific reporting views across 12–15 partners; replaced a fully manual Google Drive process requiring 10–12 hand-created documents per event",
          "Built a one-click asset generation system using the Claude API that produces a full event package per event, with RSVPs automatically synced to calendar and partner-facing tracking in real time",
          "Ship ongoing automations across team workflows: Slack-integrated invoice alerts via Zapier, prospect list scraping for cohort recruitment, and attendee schedule personalization for a 125-person annual Summit",
          "Built a Product Feedback Cohort Tracker in Apps Script using the Claude API: consolidates member status across Drive assets and Apollo, automating intros, demos, post-call feedback, and gift card distribution"
        ]
      },
      {
        role: "Founder",
        company: "ResumeHowl",
        period: "2026",
        location: "Remote",
        description: "Solo-built and launched a SaaS product end-to-end, including product architecture, pricing strategy, compliance, billing infrastructure, and an admin dashboard for usage and error tracking.",
        achievements: [
          "Designed full operational infrastructure: three-tier pricing, Stripe billing, transactional email systems, row-level data security, and an admin dashboard for real-time usage and error monitoring",
          "Integrated Claude AI for resume rewriting with model fallbacks to maintain reliability at scale",
          "Managed broad-ranging functions: copywriting, legal docs, customer support systems, product positioning"
        ]
      },
      {
        role: "Disaster Recovery Case Worker, Volunteer",
        company: "American Red Cross",
        period: "2025 – Present",
        location: "Remote",
        description: "Virtual case management in a distributed, high-stakes environment supporting disaster survivors through structured recovery workflows using Salesforce.",
        achievements: [
          "Manage active caseload using Salesforce in a compliance-sensitive context where data accuracy directly affects client outcomes for case progression",
          "Coordinate regularly across 2–3 specialized teams per case (Recovery Planning, Spiritual Care, Health Services) and with supervisors and external community partners to move cases through to resolution"
        ]
      },
      {
        role: "General Manager",
        company: "Global Bikes",
        period: "2009 – 2018",
        location: "Phoenix, AZ",
        description: "Progressed from part-time associate to full-time General Manager within 2 years, ultimately leading operations across multiple locations sequentially. Trusted internally as a resource for underperforming stores and companywide strategy.",
        achievements: [
          "Drove consistent 10%+ revenue growth year over year holding full operational ownership at each location",
          "Led implementation of new POS and loyalty systems; established companywide manager meetings and store-level employee meetings to standardize communication and performance management",
          "Managed teams of 6–10 with a coaching and development orientation, serving as an informal mentor and strategic resource to peer managers across the company"
        ]
      }
    ],

    education: {
      degree: "B.S., Business Administration",
      school: "Western Governors University"
    },

    skills: {
      ai: ["Claude (Max + API)", "ChatGPT", "Perplexity"],
      web: ["Next.js", "React", "Tailwind", "Supabase", "Stripe", "Resend", "Vercel"],
      automationGtm: ["Google Apps Script", "Zapier", "Webhooks", "Clay", "Apollo"],
      platforms: ["Salesforce", "Asana", "Google Workspace", "Slack", "WordPress"],
      devTools: ["GitHub", "Cloudflare"]
    }
  };

  function x(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function build() {
    const root = document.getElementById('root');

    const bio = data.bio.split('\n\n').map(p => `<p>${x(p)}</p>`).join('');

    const dot = `<span class="hl-dot">◆</span>`;
    const autos = data.highlights.automations.map(i => `<li>${dot}<span>${x(i)}</span></li>`).join('');
    const achiev = data.highlights.achievements.map(i => `<li>${dot}<span>${x(i)}</span></li>`).join('');

    const exp = data.experience.map(j => `
      <div class="exp-item">
        <div class="exp-header">
          <span class="exp-role">${x(j.role)}</span>
          <span class="exp-meta">${x(j.period)} · ${x(j.location)}</span>
        </div>
        <p class="exp-company">${x(j.company)}</p>
        <p class="exp-desc">${x(j.description)}</p>
        <ul class="exp-list">${j.achievements.map(a => `<li>${x(a)}</li>`).join('')}</ul>
      </div>`).join('');

    const skillGroup = (label, items) => `
      <div>
        <p class="skill-group-name">${label}</p>
        <div class="tags">${items.map(s => `<span class="tag">${x(s)}</span>`).join('')}</div>
      </div>`;

    root.innerHTML = `
      <div class="page">

        <header class="page-header">
          <h1 class="name">${x(data.name)}</h1>
          <div class="header-bottom">
            <div>
              <p class="title">${x(data.title)}</p>
              <div class="contact">
                <span class="contact-plain">${x(data.location)}</span>
                <span class="contact-sep">·</span>
                <a class="contact-link" href="https://${x(data.linkedin)}" target="_blank" rel="noopener">
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1"/><path d="M3.5 5.5v3M3.5 3.5v.5M5.5 8.5V6.25C5.5 5.836 5.836 5.5 6.25 5.5v0C6.664 5.5 7 5.836 7 6.25V8.5M7 6.5c0-.5.336-1 1-1s1 .5 1 1v2" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
                  LinkedIn
                </a>
                <span class="contact-sep">·</span>
                <a class="contact-link" href="https://${x(data.website)}" target="_blank" rel="noopener">
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1"/><ellipse cx="6" cy="6" rx="2" ry="4.5" stroke="currentColor" stroke-width="1"/><path d="M1.5 6h9" stroke="currentColor" stroke-width="1"/></svg>
                  ResumeHowl
                </a>
              </div>
            </div>
            <div class="photo">
              <img src="https://evincarr.com/headshot.jpg" alt="Evin Carr" />
            </div>
          </div>
        </header>

        <section class="section">
          <div class="section-head">
            <span class="section-label">About</span>
          </div>
          <div class="about">${bio}</div>
        </section>

        <section class="section">
          <div class="section-head">
            <span class="section-label">Highlights</span>
          </div>
          <div class="two-col">
            <div>
              <p class="hl-head">Automation Projects</p>
              <ul class="hl-list">${autos}</ul>
            </div>
            <div>
              <p class="hl-head">Career Highlights</p>
              <ul class="hl-list">${achiev}</ul>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <span class="section-label">Experience</span>
          </div>
          <div>${exp}</div>
        </section>

        <section class="section">
          <div class="section-head">
            <span class="section-label">Education</span>
          </div>
          <div>
            <p class="edu-degree">${x(data.education.degree)}</p>
            <p class="edu-school">${x(data.education.school)}</p>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <span class="section-label">Skills</span>
          </div>
          <div class="skills-four">
            ${skillGroup('AI', data.skills.ai)}
            ${skillGroup('Web', data.skills.web)}
            ${skillGroup('Automation & GTM', data.skills.automationGtm)}
            ${skillGroup('Platforms', data.skills.platforms)}
            ${skillGroup('Dev Tools', data.skills.devTools)}
          </div>
        </section>

        <footer>
          <span>© ${new Date().getFullYear()} Evin Carr</span>
          <span>Built with Claude AI</span>
        </footer>

      </div>
    `;
  }

  document.addEventListener('DOMContentLoaded', build);
</script>

<div id="root"></div>
</body>
</html>
